name: Stable download links

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-downloads-${{ github.repository }}
  cancel-in-progress: false

jobs:
  aliases:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official pinned commit
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Publish or verify identical full-installer aliases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 .github/scripts/publish_download_aliases.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --apply --retarget-legacy --workers 3
