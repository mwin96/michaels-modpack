plugins {
 id 'net.minecraftforge.gradle' version '[6.0,6.2)'
 id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
version='1.0.2'
group='net.michaelspack'
base { archivesName='michaels-pack-tweaks' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
minecraft { mappings channel:'official',version:'1.20.1' }
repositories { maven { url='https://repo.spongepowered.org/repository/maven-public/' } }
dependencies {
 minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
 annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin { add sourceSets.main,'zombie_tactics.refmap.json'; config 'zombie_tactics.mixins.json'; config 'michaelspack.mixins.json' }
jar { manifest { attributes(['MixinConfigs':'zombie_tactics.mixins.json,michaelspack.mixins.json']) }; finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
